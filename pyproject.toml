[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flameflow-pd-shield"
version = "0.1.5"
description = "Обезличивание персональных данных для ботов Flameflow: маскирование до индексации, зашифрованное хранилище, восстановление в ответах LLM"
requires-python = ">=3.10"
dependencies = [
    "natasha>=1.6",
    "petrovich>=1.0",
    "cryptography>=42.0",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru",
]

[project.optional-dependencies]
# для CLI-инвентаризации файлов (pd-scan)
scan = [
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
]
dev = ["pytest>=8.0"]

[project.scripts]
pd-scan = "pd_shield.scan:main"

[tool.setuptools]
packages = ["pd_shield"]
